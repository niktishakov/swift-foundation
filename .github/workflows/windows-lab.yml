name: Fork test only - Windows

on:
  push:
    branches: [windows-lab-baseline-docker]

permissions:
  contents: read

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.15
    with:
      enable_linux_checks: false
      enable_macos_checks: false
      enable_windows_checks: true
      windows_swift_versions: '["nightly-main"]'
      enable_windows_docker: true
